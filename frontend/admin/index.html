<!doctype html>
<!-- Painel de conteúdo (Decap CMS), em /admin/.
     - No site (Vercel): login com o GitHub (api/auth.js + api/callback.js); cada
       "Publicar" vira um commit no repositório e a Vercel publica sozinha.
     - No computador (npm run dev → http://localhost:5173/admin/): o decap-server
       (porta 8081) grava direto nos arquivos do projeto, sem login. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Painel · Bento Avellar</title>
    <script>
      window.CMS_MANUAL_INIT = true

      // O login do GitHub só aceita o endereço principal do site (o mesmo do
      // OAuth App). Aberto por outro endereço da Vercel, vai para o principal.
      // Ao trocar para o domínio próprio: atualizar aqui e no OAuth App.
      var SITE_HOST = 'portfolio-bento24.vercel.app'
      if (/\.vercel\.app$/.test(location.hostname) && location.hostname !== SITE_HOST) {
        location.replace('https://' + SITE_HOST + location.pathname + location.hash)
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      // Imagens ou vídeos. Vídeo (.mp4/.webm) toca sozinho, em loop e sem som.
      // Widget "file" (e não "image") para aceitar vídeo também.
      const VIDEO_HINT = 'Imagem ou vídeo (.mp4/.webm, até ~10 MB; toca em loop, sem som).'

      // No computador os caminhos são relativos à pasta frontend (onde o
      // decap-server roda); no site, relativos à raiz do repositório.
      const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname)
      const ROOT = LOCAL ? '' : 'frontend/'

      CMS.init({
        config: {
          load_config_file: false,
          local_backend: LOCAL,
          backend: {
            name: 'github',
            repo: 'bento295-coder/portfolio',
            branch: 'main',
            base_url: location.origin,
            auth_endpoint: 'api/auth',
            commit_messages: {
              create: 'Painel: novo projeto "{{slug}}"',
              update: 'Painel: atualiza "{{slug}}"',
              delete: 'Painel: apaga "{{slug}}"',
              uploadMedia: 'Painel: envia {{path}}',
              deleteMedia: 'Painel: apaga {{path}}',
            },
          },
          media_folder: ROOT + 'public/uploads',
          public_folder: '/uploads',
          collections: [
            {
              name: 'site',
              label: 'Info',
              description: 'Tudo o que aparece na página Info (e o contato do footer).',
              editor: { preview: false },
              files: [
                {
                  name: 'info',
                  label: 'Página Info',
                  file: ROOT + 'src/content/info.json',
                  fields: [
                    {
                      label: 'Foto',
                      name: 'photo',
                      widget: 'select',
                      hint: 'Retrato do Info (só a tinta; fica branco no modo escuro).',
                      options: [
                        { label: '1. Paletó, bananeira', value: '/info/bento-1.webp' },
                        { label: '2. Camisa listrada, janela', value: '/info/bento-2.webp' },
                        { label: '3. Gola alta, sombra de folhas', value: '/info/bento-3.webp' },
                      ],
                    },
                    {
                      label: 'About',
                      name: 'about',
                      widget: 'object',
                      collapsed: false,
                      fields: ['pt', 'en'].map((lang) => ({
                        label: lang === 'pt' ? 'Português' : 'Inglês',
                        name: lang,
                        widget: 'object',
                        fields: [
                          {
                            label: 'Frase de abertura',
                            name: 'lead',
                            widget: 'string',
                            hint: 'No computador ela sai da coluna, para a esquerda.',
                          },
                          {
                            label: 'Parágrafos',
                            name: 'paragraphs',
                            widget: 'list',
                            label_singular: 'parágrafo',
                            summary: '{{fields.text}}',
                            fields: [{ label: 'Texto', name: 'text', widget: 'text' }],
                          },
                        ],
                      })),
                    },
                    {
                      label: 'Convite (abaixo do About)',
                      name: 'cta',
                      widget: 'object',
                      fields: [
                        { label: 'Português', name: 'pt', widget: 'string' },
                        { label: 'Inglês', name: 'en', widget: 'string' },
                      ],
                    },
                    {
                      label: 'Proficiências',
                      name: 'proficiencies',
                      widget: 'list',
                      label_singular: 'proficiência',
                      summary: '{{fields.name}}',
                      fields: [{ label: 'Nome', name: 'name', widget: 'string' }],
                    },
                    {
                      label: 'Contato',
                      name: 'contact',
                      widget: 'object',
                      hint: 'Aparece no Info e no footer.',
                      fields: [
                        { label: 'E-mail', name: 'email', widget: 'string' },
                        { label: 'País', name: 'country', widget: 'string' },
                        { label: 'Telefone', name: 'phone', widget: 'string' },
                        { label: 'Cidade', name: 'city', widget: 'string' },
                      ],
                    },
                    {
                      label: 'Redes',
                      name: 'social',
                      widget: 'list',
                      label_singular: 'rede',
                      summary: '{{fields.label}}',
                      fields: [
                        { label: 'Nome', name: 'label', widget: 'string' },
                        { label: 'Link', name: 'url', widget: 'string', hint: 'Endereço completo, começando com https://' },
                      ],
                    },
                    {
                      label: 'Clientes',
                      name: 'clients',
                      widget: 'list',
                      label_singular: 'cliente',
                      summary: '{{fields.name}}',
                      fields: [{ label: 'Nome', name: 'name', widget: 'string' }],
                    },
                    {
                      label: 'Colaborações',
                      name: 'collaborators',
                      widget: 'list',
                      label_singular: 'colaboração',
                      summary: '{{fields.name}}',
                      fields: [{ label: 'Nome', name: 'name', widget: 'string' }],
                    },
                    {
                      label: 'Créditos',
                      name: 'credits',
                      widget: 'object',
                      fields: [
                        { label: 'Linha 1', name: 'line1', widget: 'string' },
                        { label: 'Linha 2', name: 'line2', widget: 'string' },
                      ],
                    },
                  ],
                },
              ],
            },
            {
              name: 'projetos',
              label: 'Projetos',
              label_singular: 'Projeto',
              description:
                'Cada projeto aparece no card da home (thumb 16:9) e na página do projeto (galeria; a 1ª imagem abre a página, antes dos textos).',
              folder: ROOT + 'src/content/projects',
              format: 'json',
              extension: 'json',
              create: true,
              // a prévia padrão não usa o visual do site; o site em localhost é a prévia real
              editor: { preview: false },
              // nome do arquivo = endereço da página: /projetos/<slug>
              slug: '{{slug}}',
              identifier_field: 'title',
              summary: '{{order}}. {{title}}',
              sortable_fields: ['order', 'title', 'year'],
              fields: [
                { label: 'Título', name: 'title', widget: 'string' },
                {
                  label: 'Bio',
                  name: 'description',
                  widget: 'object',
                  collapsed: false,
                  fields: [
                    { label: 'Português', name: 'pt', widget: 'text' },
                    { label: 'Inglês', name: 'en', widget: 'text' },
                  ],
                },
                { label: 'Ano', name: 'year', widget: 'string' },
                { label: 'Serviço', name: 'service', widget: 'string' },
                { label: 'Cliente', name: 'client', widget: 'string' },
                { label: 'Colaboração', name: 'collaboration', widget: 'string', required: false },
                {
                  label: 'Thumb da home (16:9)',
                  name: 'thumb',
                  widget: 'file',
                  hint: `Card na home, sempre em 16:9 (o excesso é cortado). ${VIDEO_HINT}`,
                },
                {
                  label: 'Galeria',
                  name: 'images',
                  widget: 'list',
                  required: false,
                  summary: '{{fields.src}}',
                  hint: `Mídias da página do projeto, na ordem em que aparecem, cada uma inteira na proporção em que foi exportada (sem corte). ${VIDEO_HINT}`,
                  fields: [{ label: 'Arquivo', name: 'src', widget: 'file' }],
                },
                {
                  label: 'Ordem na home',
                  name: 'order',
                  widget: 'number',
                  value_type: 'int',
                  default: 99,
                  hint: 'Menor número aparece primeiro.',
                },
                {
                  label: 'Publicado',
                  name: 'published',
                  widget: 'boolean',
                  default: true,
                  hint: 'Desligado: o projeto não aparece no site (rascunho).',
                },
              ],
            },
          ],
        },
      })
    </script>
  </body>
</html>
